<!doctype html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#287681">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_AU">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/img/Math4MLlogo2-2.png' | absolute_url }}">
    <meta property="og:image:alt" content="Math4ML — Mathematics for Machine Learning">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/png" href="{{ '/img/Math4MLlogo2-2.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </head>
  <body id="top">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header container">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Math4ML home">Math<span>4</span>ML</a>
      <nav class="site-navigation" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}#about">About</a>
        <a href="{{ '/' | relative_url }}#seminars">Seminars</a>
        <a href="{{ '/' | relative_url }}#events">Events</a>
        <a href="{{ '/' | relative_url }}#committee">Committee</a>
        <a href="{{ '/' | relative_url }}#membership">Membership</a>
      </nav>
    </header>

    <main id="main" class="container" tabindex="-1">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="footer-content container">
        <div>
          <a class="footer-name" href="{{ '/' | relative_url }}">Math4ML</a>
          <p>A Special Interest Group of the<br><a href="{{ site.links.group }}">Australian Mathematical Society</a></p>
        </div>
        <ul class="social-links" aria-label="Follow Math4ML">
          <li><a href="{{ site.links.bluesky }}" aria-label="Math4ML on Bluesky" title="Bluesky">{% include icon.html name="bluesky" %}</a></li>
          <li><a href="{{ site.links.linkedin }}" aria-label="Math4ML on LinkedIn" title="LinkedIn">{% include icon.html name="linkedin" %}</a></li>
          <li><a href="{{ site.links.youtube }}" aria-label="Math4ML on YouTube" title="YouTube">{% include icon.html name="youtube" %}</a></li>
        </ul>
      </div>
    </footer>
  </body>
</html>
